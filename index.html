<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Finance Tracker</h1>
            <div class="balance-summary">
                <div class="balance-item">
                    <span class="label">Total Income:</span>
                    <span class="value income" id="total-income">$0.00</span>
                </div>
                <div class="balance-item">
                    <span class="label">Total Expenses:</span>
                    <span class="value expense" id="total-expenses">$0.00</span>
                </div>
                <div class="balance-item balance-total">
                    <span class="label">Balance:</span>
                    <span class="value" id="balance">$0.00</span>
                </div>
            </div>
            <div class="settings-row" role="group" aria-label="Display settings">
                <label for="currency-select">Currency:
                    <select id="currency-select"></select>
                </label>
                <label for="locale-select">Locale:
                    <select id="locale-select"></select>
                </label>
                <label for="theme-select">Theme:
                    <select id="theme-select"></select>
                </label>
            </div>
        </header>

        <section class="add-transaction">
            <h2>Add Transaction</h2>
            <form id="transaction-form" class="transaction-form" novalidate>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" required maxlength="100" aria-describedby="description-error">
                    <p class="field-error" id="description-error" hidden></p>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required aria-describedby="amount-error">
                        <p class="field-error" id="amount-error" hidden></p>
                    </div>

                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" name="type" required aria-describedby="type-error">
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                        <p class="field-error" id="type-error" hidden></p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" name="category" list="category-options" required maxlength="50" aria-describedby="category-error">
                        <p class="field-error" id="category-error" hidden></p>
                        <datalist id="category-options">
                            <option value="Food"></option>
                            <option value="Housing"></option>
                            <option value="Transport"></option>
                            <option value="Utilities"></option>
                            <option value="Subscriptions"></option>
                            <option value="Health"></option>
                            <option value="Entertainment"></option>
                            <option value="Shopping"></option>
                            <option value="Salary"></option>
                            <option value="Freelance"></option>
                            <option value="Other"></option>
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required aria-describedby="date-error">
                        <p class="field-error" id="date-error" hidden></p>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Add Transaction</button>
                    <button type="button" class="btn btn-secondary" id="cancel-edit-btn" hidden>Cancel Edit</button>
                    <button type="button" class="btn btn-danger" id="clear-all-btn">Clear All</button>
                </div>
            </form>
            <div id="message-area" class="message" role="status" aria-live="polite"></div>
        </section>

        <section class="transactions-section">
            <div class="section-header">
                <h2>Transactions</h2>
                <div class="toolbar-group">
                    <label for="filter-type">Type:</label>
                    <select id="filter-type">
                        <option value="all">All</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>

                    <label for="sort-order">Sort:</label>
                    <select id="sort-order">
                        <option value="date-newest">Newest first</option>
                        <option value="date-oldest">Oldest first</option>
                        <option value="amount-high">Amount: High to Low</option>
                        <option value="amount-low">Amount: Low to High</option>
                        <option value="description-az">Description: A to Z</option>
                        <option value="description-za">Description: Z to A</option>
                    </select>
                </div>
            </div>
            <div class="transactions-list" id="transactions-list">
            </div>
        </section>

        <section class="chart-section">
            <h2>Expenses by Category</h2>
            <div class="chart-wrapper">
                <canvas id="expenseChart" aria-label="Expenses by category chart"></canvas>
                <p class="chart-empty" id="chart-empty">No expense data, yet...</p>
            </div>
        </section>
    </main>

    <script src="js/vendor/chart.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
